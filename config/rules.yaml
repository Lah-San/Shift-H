  policy_backed: true
- id: FAT-007
  name: Maximum shift length
  category: fatigue
  enabled: true
  severity: hard
  params: {}
  source: ANF cl.28(10); HSUWA cl.16; AMA cl.12
  manager: Shift longer than {max} h for this agreement.
  policy_backed: true
- id: FAT-008
  name: Doctors in training hour caps
  category: fatigue
  enabled: true
  severity: hard
  params: {}
  source: AMA Agreement 2024 Part 2 (75 h / 7 days, 140 h / 14 days)
  manager: Would exceed {max7} h in 7 days or {max14} h in 14 days.
  policy_backed: true
- id: FAT-009
  name: No night shift or on-call immediately before leave
  category: fatigue
  enabled: true
  severity: info
  params: {}
  source: AMA (no night before approved leave); ANF cl.31(16) (no on-call the day before leave)
  public: You are rostered on a night shift the day before your leave starts; the roster should be adjusted.
  manager: Requester rostered on a night shift the day before leave.
  policy_backed: true
- id: FAT-010
  name: Flag existing roster breaches
  category: fatigue
  enabled: true
  severity: info
  params: {}
  source: WACHS Roster Guideline s4.1 (RoStar verification messages)
  manager: Existing roster already breaches rest rules for this person around these dates.
  policy_backed: true
- id: SCK-001
  name: Sick and carer's leave is accepted immediately
  category: urgent
  enabled: true
  severity: info
  locked: false
  params: {}
  source: 'ANF cl.38(20): reasonable and legitimate requests will be approved subject to credits'
  description: Urgent leave is never refused on staffing grounds. The manager is notified and cover is recommended.
  public: Your sick / carer's leave is recorded. Your manager has been notified and will arrange cover. Get well soon.
  manager: Urgent leave accepted automatically; cover recommendations attached.
  policy_backed: true
- id: SCK-002
  name: Evidence needed for longer sick leave
