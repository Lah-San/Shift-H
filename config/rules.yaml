rules:
- id: REQ-001
  name: Dates must be valid
  category: request
  enabled: true
  severity: hard
  locked: true
  params: {}
  source: System
  description: End date must be on or after the start date.
  public: The end date is before the start date.
  manager: Invalid date range.
  policy_backed: false
- id: REQ-002
  name: Leave type recognised
  category: request
  enabled: true
  severity: hard
  locked: true
  params: {}
  source: System
  public: That leave type is not available.
  manager: Unknown leave type.
  policy_backed: false
- id: REQ-003
  name: No back-dated planned leave
  category: request
  enabled: true
  severity: hard
  params:
    backdate_days_allowed_for_urgent: 3
  source: MP 0100/18 s3.3 (timely applications)
  description: Planned leave cannot start in the past. Sick/carer's leave may be back-dated up to N days.
  public: Planned leave cannot start in the past. Sick or carer's leave can be recorded for the last {backdate_days_allowed_for_urgent}
    days.
  manager: Start date is before today.
  policy_backed: true
- id: REQ-004
  name: Maximum single block length
  category: request
  enabled: true
  severity: soft
  params: {}
  source: 'ANF cl.33(16): blocks; local practice'
  description: Blocks longer than the leave type's maximum go to the manager.
  public: A single block this long needs manager approval.
  manager: Block exceeds the usual maximum for this leave type.
  policy_backed: true
- id: ELG-001
  name: Contract must cover the leave dates
  category: eligibility
  enabled: true
  severity: soft
  params: {}
  source: Employee contract (Position Entry End Date)
  description: Fixed-term contracts are often renewed, so this goes to the manager to confirm rather than blocking.
  public: Your current contract ends before these dates, so a manager needs to confirm the contract will continue.
  manager: Fixed-term contract ends {contract_end}, before the leave ends. Confirm renewal before approving.
  policy_backed: true
- id: ELG-002
  name: Casual staff cannot take paid leave types
  category: eligibility
  enabled: true
  severity: hard
  params: {}
  source: ANF cl.14 / HSUWA cl.13 (casual loading in lieu of paid leave)
  public: As a casual employee this paid leave type is not available. You can record unavailability or leave without pay instead.
  manager: Casual employee requested a paid leave type.
  policy_backed: true
- id: ELG-003
  name: Long service leave needs 7 years' service
  category: eligibility
  enabled: true
  severity: hard
  params:
    min_years: 7
  source: ANF cl.35(1); AMA cl.38; HSUWA cl.47
  public: Long service leave becomes available after {min_years} years of service.
  manager: Service is below {min_years} years.
  policy_backed: true
- id: BAL-001
  name: Enough leave balance at the start date
  category: balance
  enabled: true
  severity: hard
  params:
    allow_negative_hours: 0
  source: Leave Balances; accrual per agreement
  description: Projected balance = current balance + accrual until the start date. Requested hours = your rostered hours inside
    the dates.
  public: Your projected balance ({projected_hours} h) is less than the {requested_hours} h these dates would use.
  manager: Projected balance {projected_hours} h < requested {requested_hours} h.
  policy_backed: true
- id: BAL-002
  name: Excess leave gets priority
  category: balance
  enabled: true
  severity: info
  params:
    entitlements_threshold: 2.0
  source: MP 0100/18 s3, s7 (Excess Leave = more than two accrued entitlements)
  description: Staff above two years' entitlement are encouraged to take leave and win ties for the same dates.
  public: You hold more than two years of annual leave. Taking leave now is encouraged and this request is given priority.
  manager: Employee has Excess Leave ({balance_hours} h > {threshold_hours} h). An Employee Leave Management Plan is required
    (MP 0100/18 s3.2).
  policy_backed: true
- id: BAL-003
  name: Unknown balance policy
  category: balance
  enabled: true
  severity: soft
  params: {}
  source: Local
  description: If no balance record exists for the leave type, the request goes to the manager instead of being blocked.
  public: We could not find a balance for this leave type, so a manager will confirm it.
  manager: No balance record for {balance_code}.
  policy_backed: false
- id: NOT-001
  name: Minimum notice for planned leave
  category: notice
  enabled: true
  severity: soft
  params: {}
  source: MP 0100/18 s3.3 (sufficient notice); roster posted 28 days ahead (ANF cl.28(18))
  description: Planned leave with less than the agreement's notice period goes to the manager.
  public: You are giving {lead_days} days' notice and {notice_days} are normally needed, so a manager needs to confirm it.
  manager: Only {lead_days} days' notice (minimum {notice_days}).
  policy_backed: true
- id: NOT-002
  name: Long service leave notice
  category: notice
  enabled: true
  severity: soft
  params: {}
  source: ANF cl.35 (8 weeks); AMA cl.38 (3 months); HSUWA cl.47
  public: You are giving {lead_days} days' notice; long service leave normally needs {notice_days}, so a manager will confirm.
  manager: LSL notice {lead_days} days (minimum {notice_days}).
  policy_backed: true
- id: NOT-003
  name: Leave inside the posted roster
  category: notice
  enabled: true
  severity: info
  params: {}
  source: ANF cl.28(18)-(19)
  description: Leave that starts inside the published roster means a roster alteration.
  public: Your roster is already published for {known_days} of these {days} days, so those shifts will be re-arranged.
  manager: Roster alteration required (inside the {published_days}-day published window).
  policy_backed: true
- id: NOT-004
  name: Professional development / purchased / parental notice
  category: notice
  enabled: true
  severity: soft
  params: {}
  source: ANF cl.55; Purchased Leave Guidelines; parental leave provisions
  public: This leave type normally needs {notice_days} days' notice, so a manager will confirm.
  manager: Notice {lead_days} days (minimum {notice_days}).
  policy_backed: true
- id: BLK-001
  name: Nurses' leave above 10 weeks is employer-scheduled
  category: block
  enabled: true
  severity: info
  params: {}
  source: ANF cl.33(20)-(21)
  public: Because your annual leave balance is above 10 weeks, your employer may schedule some of it in blocks of five days
    or more.
  manager: 'Balance above {weeks} weeks: employer may direct leave in 5-day blocks (unless a request was refused in the last
    12 months).'
  policy_backed: true
- id: COV-001
  name: Ward must stay at its required staffing on every shift
  category: coverage
  enabled: true
  severity: hard
  locked: false
  params: {}
  source: MP 0187/24 s3.2.1, s3.4.1; NHpPD profile; ANF cl.16(1)(f)
  description: 'Each of your rostered shifts is checked: after you leave, does the ward still have the required number of
    staff in your role? If not, cover is searched for.'
  public: '{gap_shifts} of your {total_shifts} rostered shifts would leave the ward below its required staffing and no cover
    could be found.'
  manager: '{gap_shifts}/{total_shifts} shifts below requirement without cover.'
  policy_backed: true
- id: COV-002
  name: Limit on how many of a team can be away at once
  category: coverage
  enabled: true
  severity: soft
  params:
    max_fraction_on_leave: 0.34
    min_team_size: 6
  source: WACHS Roster Guideline s2.4 (number of FTE on leave at any one time); MP 0100/18 s3.4
  public: More than {pct}% of your team would be away on {days} of the days requested, so a manager needs to decide.
  manager: Team-away share exceeds {pct}% on {days} day(s).
  policy_backed: true
- id: COV-003
  name: Cover that needs overtime requires authorisation
  category: coverage
  enabled: true
  severity: soft
  params: {}
  source: ANF cl.30(1); WACHS Fatigue Management Policy
  public: Cover is possible, but only with overtime, which a manager must authorise.
  manager: '{overtime_shifts} shift(s) can only be covered with authorised overtime.'
  policy_backed: true
- id: COV-004
  name: Absences of two weeks or less are not backfilled unless the ward would fall short
  category: coverage
  enabled: true
  severity: info
  params:
    days: 14
  source: MP 0100/18 s3.4; AMA cl.34(14)
  description: Short absences only trigger cover when the ward would actually fall below its requirement.
  public: Short absences are only backfilled where the ward would otherwise fall short.
  manager: 'Absence <= {days} days: backfill only where required.'
  policy_backed: true
- id: COV-005
  name: No more than half a medical department on professional development leave
  category: coverage
  enabled: true
  severity: soft
  params:
    max_fraction: 0.5
  source: AMA Agreement 2024 (senior practitioners' PDL)
  public: Too many colleagues from your department would be on professional development leave at the same time.
  manager: Department PDL share exceeds {pct}%.
  policy_backed: true
- id: COV-006
  name: Donor ward must stay at requirement when a colleague is moved
  category: coverage
  enabled: true
  severity: hard
  locked: false
  params: {}
  source: MP 0187/24 Non-Compliance Form (staff balanced to another area)
  description: Never fix one ward by breaking another.
  public: ''
  manager: 'Redeployment rejected: donor ward would fall below requirement.'
  policy_backed: true
- id: COV-007
  name: Buffer for unplanned absence
  category: coverage
  enabled: true
  severity: info
  locked: false
  params:
    min_expected_absences: 0.5
  source: WACHS Roster Guideline s2.4; historical personal leave rate in the roster data
  description: Wards run a typical rate of same-day sick calls. When your absence would leave fewer spare staff than that
    rate, the manager is told so they can plan a buffer.
  public: '{shifts} of your shifts would leave the ward with no spare staff for the usual rate of sick calls; your manager
    is told so they can plan a buffer.'
  manager: '{shifts} shift(s) would have no buffer for unplanned absence (about {expected} sick call(s) expected per shift
    from the ward''s history).'
  policy_backed: true
- id: FAT-001
  name: Minimum rest between shifts
  category: fatigue
  enabled: true
  severity: hard
  params: {}
  source: ANF cl.28(12), cl.30(4); HSUWA cl.17; AMA cl.12
  manager: Candidate would have less than {hours} h rest.
  policy_backed: true
- id: FAT-002
  name: Rest when changing between night and day duty
  category: fatigue
  enabled: true
  severity: hard
  params: {}
  source: ANF cl.28(11)
  manager: Night-to-day changeover needs {hours} h free.
  policy_backed: true
- id: FAT-003
  name: Maximum consecutive duties
  category: fatigue
  enabled: true
  severity: hard
  params: {}
